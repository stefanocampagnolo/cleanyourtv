name: Build Telecamere APK

# Solo sul branch "telecamere": main resta identico all'originale.
on:
  push:
    branches: [telecamere]
    paths: ["telecamere/**", ".github/workflows/build-telecamere.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"
      - name: Build release
        working-directory: telecamere
        run: gradle --no-daemon :app:assembleRelease
      - name: Checksum e info build
        run: |
          mkdir out && cp telecamere/app/build/outputs/apk/release/app-release.apk out/telecamere.apk
          cd out && sha256sum telecamere.apk | tee telecamere.apk.sha256
          echo "commit=${GITHUB_SHA}" > build-info.txt
          echo "repo=${GITHUB_REPOSITORY}" >> build-info.txt
          echo "run=${GITHUB_RUN_ID}" >> build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: telecamere-apk
          path: out/
          retention-days: 30
