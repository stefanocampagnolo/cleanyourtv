plugins { id 'com.android.application' }

android {
    namespace 'it.aibox.telecamere'
    compileSdk 34
    defaultConfig {
        applicationId 'it.aibox.telecamere'
        minSdk 26
        targetSdk 31
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        ndk { abiFilters 'armeabi-v7a' } // la Philips ha userspace a 32 bit: APK più piccolo
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // repo pubblico: nessuna chiave nel codice
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // libVLC: per le telecamere con SDP che Media3 rifiuta (es. sprop-parameter-sets vuoto)
    implementation 'org.videolan.android:libvlc-all:3.7.7'
}
